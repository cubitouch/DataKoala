name: Source release tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate source release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches package version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./package.json').version")"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use an exact stable version tag such as v0.2.0, not $tag" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Verify released source belongs to main
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag must point to a commit on main." >&2
            exit 1
          }
