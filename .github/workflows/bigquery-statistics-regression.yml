name: BigQuery Statistics Regression

on:
  pull_request:
    paths:
      - 'src/renderer/src/components/results/QueryStatistics*'
      - 'src/renderer/src/components/results/ResultsTable*'
      - 'src/renderer/src/components/results/GenericResultExplorer*'
      - 'scripts/visual-preview/bigquery-statistics-fixture.ts'
      - 'scripts/visual-preview/audit-batches/fix-91.mjs'
      - '.github/workflows/bigquery-statistics-regression.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - run: node --experimental-strip-types scripts/visual-preview/bigquery-statistics-fixture.ts "$RUNNER_TEMP/bigquery-statistics.json"
      - run: pnpm build
      - name: Verify native stabilization contract
        env:
          DATAKOALA_STATS_FIXTURE: ${{ runner.temp }}/bigquery-statistics.json
          DATAKOALA_PREVIEW_KIND: audit
          DATAKOALA_AUDIT_BATCH: fix-91
          DATAKOALA_AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
          DATAKOALA_PREVIEW_OUTPUT: bigquery-statistics-regression
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bigquery-statistics-regression
          path: bigquery-statistics-regression
