name: Visual preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_FILES: |-
        sql-default.png
        sql-resized-panes.png
        sql-long-query-scroll.png
        sql-wide-sidebar-long-names.png
        sql-narrow-short-tooltip.png
        builder.png
        table.png

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron display libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64

      - name: Build application
        run: pnpm build

      - name: Capture application previews
        run: DATAKOALA_PREVIEW_OUTPUT=visual-preview xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs

      - name: Validate preview image set
        shell: bash
        run: |
          printf '%s\n' "$PREVIEW_FILES" | sed '/^$/d' | sort > expected-previews.txt
          find visual-preview -maxdepth 1 -type f -name '*.png' -exec basename {} \; | sort > actual-previews.txt
          if ! diff -u expected-previews.txt actual-previews.txt; then
            echo "Captured preview images do not match PREVIEW_FILES" >&2
            exit 1
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: datakoala-visual-preview-pr-${{ github.event.pull_request.number }}
          path: visual-preview/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: visual-previews
          path: preview-publish

      - name: Publish preview images
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          publish_dir="preview-publish/pr-${PR_NUMBER}"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          while IFS= read -r filename; do
            [ -n "$filename" ] || continue
            test -f "visual-preview/$filename"
            cp "visual-preview/$filename" "$publish_dir/$filename"
          done <<< "$PREVIEW_FILES"
          cd preview-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "pr-${PR_NUMBER}"
          if git diff --cached --quiet; then
            echo "Preview images are unchanged"
          else
            git commit -m "Update visual previews for PR #${PR_NUMBER} (${HEAD_SHA:0:7})"
            git push origin visual-previews
          fi

      - name: Create or update PR comment
        uses: actions/github-script@v7
        env:
          PREVIEW_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/visual-previews/pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- datakoala-visual-preview -->'
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7)
            const captions = {
              'sql-default.png': 'SQL mode — default dimensions',
              'sql-resized-panes.png': 'SQL mode — resized sidebar and editor',
              'sql-long-query-scroll.png': 'SQL mode — long query scrolling internally',
              'sql-wide-sidebar-long-names.png': 'SQL mode — widened sidebar with long object names',
              'sql-narrow-short-tooltip.png': 'SQL mode — narrow/short window with chart tooltip',
              'builder.png': 'Builder mode',
              'table.png': 'Filtered results table'
            }
            const files = process.env.PREVIEW_FILES.split(/\r?\n/).filter(Boolean)
            const previews = files.map((filename) => {
              const caption = captions[filename]
              if (!caption) throw new Error(`Missing PR-comment caption for ${filename}`)
              const url = `${process.env.PREVIEW_BASE_URL}/${filename}?raw=1&sha=${context.payload.pull_request.head.sha}`
              return `### ${caption}\n\n![DataKoala ${caption}](${url})`
            }).join('\n\n')
            const body = `${marker}
            ## Visual previews

            Generated from commit \`${shortSha}\`.

            ${previews}

            All ${files.length} full-resolution PNGs are also available from this workflow run's **Artifacts** section.`

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              })
            }
