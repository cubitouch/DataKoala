name: EXPLAIN Readability Regression

on:
  pull_request:
    paths:
      - 'src/renderer/src/components/query/sql/ExplainPane*'
      - 'src/renderer/src/components/query/sql/ExecutionPlanGraph*'
      - 'scripts/capture-explain-preview.mjs'
      - '.github/workflows/explain-readability-regression.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - run: pnpm build
      - name: Capture base branching plan with identical native fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          explain_before="$RUNNER_TEMP/explain-before"
          git worktree add --detach "$explain_before" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$explain_before/node_modules"
          cd "$explain_before"
          pnpm exec electron-vite build
          DATAKOALA_PREVIEW_OUTPUT="$GITHUB_WORKSPACE/explain-readability-regression/before" xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' pnpm exec electron --no-sandbox scripts/capture-explain-preview.mjs
      - name: Capture readable branching plan on final head
        run: DATAKOALA_PREVIEW_OUTPUT=explain-readability-regression/after xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' pnpm exec electron --no-sandbox scripts/capture-explain-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: explain-readability-regression
          path: explain-readability-regression
