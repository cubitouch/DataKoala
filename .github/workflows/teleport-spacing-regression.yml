name: Teleport Spacing Regression

on:
  pull_request:
    paths:
      - 'src/renderer/src/components/connections/PostgresConnectionModal*'
      - 'src/renderer/src/components/connections/ConnectionModal.module.css'
      - 'scripts/visual-preview/audit-batches/manual-17.mjs'
      - '.github/workflows/teleport-spacing-regression.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - run: pnpm build
      - name: Capture base layout with the same fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DATAKOALA_PREVIEW_KIND: audit
          DATAKOALA_AUDIT_BATCH: manual-17
          DATAKOALA_CAPTURE_BASE: '1'
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          spacing_before="$RUNNER_TEMP/teleport-spacing-before"
          git worktree add --detach "$spacing_before" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$spacing_before/node_modules"
          cp scripts/visual-preview/audit-batches/manual-17.mjs "$spacing_before/scripts/visual-preview/audit-batches/"
          cd "$spacing_before"
          pnpm exec electron-vite build
          DATAKOALA_AUDIT_HEAD="$BASE_SHA" DATAKOALA_PREVIEW_OUTPUT="$GITHUB_WORKSPACE/teleport-spacing-regression/before" xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs
      - name: Verify native stabilization contract
        env:
          DATAKOALA_PREVIEW_KIND: audit
          DATAKOALA_AUDIT_BATCH: manual-17
          DATAKOALA_AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
          DATAKOALA_PREVIEW_OUTPUT: teleport-spacing-regression
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: teleport-spacing-regression
          path: teleport-spacing-regression
