name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report code duplication (advisory)
        run: pnpm report:duplication

      - name: Upload code duplication report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-duplication-report
          path: reports/duplication/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check changed files for whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check renderer controls
        run: pnpm check:renderer-controls

      - name: Check dead code
        run: pnpm check:dead-code

      - name: Check renderer import boundaries
        run: pnpm lint:imports

      - name: Check formatting
        run: |
          if ! pnpm format; then
            pnpm exec prettier .github/workflows/README.md | diff -u .github/workflows/README.md - || true
            exit 1
          fi

      - name: Lint TypeScript and React
        run: pnpm lint:ts

      - name: Lint CSS
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire official SQLite extension
        run: pnpm prepare:sqlite-extension

      - name: Run unit and SQLite integration tests
        run: pnpm test && pnpm smoke:sqlite

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run UI tests
        run: pnpm test:ui

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm prepare:sqlite-extension && pnpm build

  duckdb-macos-runtime:
    name: DuckDB macOS runtime and package
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke BigQuery client in Electron runtime
        run: pnpm smoke:bigquery-client

      - name: Build and smoke DuckDB in Electron
        run: pnpm prepare:sqlite-extension && pnpm build && pnpm smoke:duckdb && pnpm smoke:sqlite && pnpm smoke:sqlite:electron

      - name: Package unpacked application
        run: pnpm package

      - name: Smoke DuckDB in packaged application
        shell: bash
        run: |
          app_bin="$(find dist -type f -path '*/DataKoala.app/Contents/MacOS/DataKoala' -print -quit)"
          test -n "$app_bin"
          DATAKOALA_ELECTRON_BIN="$app_bin" pnpm smoke:duckdb
          DATAKOALA_ELECTRON_BIN="$app_bin" pnpm smoke:sqlite:electron
