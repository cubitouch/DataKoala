name: Temporary format PostgreSQL TLS

on:
  push:
    branches:
      - feat/postgres-tls-modes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        run: |
          pnpm exec prettier --write \
            src/main/adapters/postgres.tls.test.ts \
            src/main/adapters/postgres.ts \
            src/main/connections-store.test.ts \
            src/renderer/src/components/connections/ConnectionModal.test.tsx \
            src/renderer/src/components/connections/PostgresConnectionModal.tsx \
            src/renderer/src/lib/connectionDraft.test.ts \
            src/shared/connString.test.ts \
            src/shared/connString.ts \
            src/shared/types.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format PostgreSQL TLS implementation"
          git push
