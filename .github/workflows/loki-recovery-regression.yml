name: Loki Recovery Regression

on:
  pull_request:
    paths:
      - 'src/renderer/src/components/workspaces/loki/**'
      - 'src/renderer/src/components/sidebar/LokiSidebarTree*'
      - 'src/renderer/src/components/builder/loki/**'
      - 'scripts/visual-preview/audit-batches/stab-32.mjs'
      - '.github/workflows/loki-recovery-regression.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - run: pnpm build
      - name: Verify native stabilization contract
        env:
          DATAKOALA_PREVIEW_KIND: audit
          DATAKOALA_AUDIT_BATCH: stab-32
          DATAKOALA_AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
          DATAKOALA_PREVIEW_OUTPUT: loki-recovery-regression
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loki-recovery-regression
          path: loki-recovery-regression
