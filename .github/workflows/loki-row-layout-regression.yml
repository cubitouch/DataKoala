name: Loki Row Layout Regression

on:
  pull_request:
    paths:
      - 'src/renderer/src/components/results/logs/**'
      - 'src/renderer/src/components/ui/ObservabilityRow*'
      - 'scripts/visual-preview/audit-batches/fix-05.mjs'
      - '.github/workflows/loki-row-layout-regression.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
      - run: pnpm build
      - name: Capture prior draft numeric alignment with identical fixtures
        env:
          BEFORE_SHA: 67f4c56701a39e95d07202f75bf7e8c407cc7512
          DATAKOALA_PREVIEW_KIND: audit
          DATAKOALA_AUDIT_BATCH: fix-05
          DATAKOALA_BATCH4_BASELINE: '1'
          DATAKOALA_AUDIT_HEAD: 67f4c56701a39e95d07202f75bf7e8c407cc7512
        run: |
          git fetch origin "$BEFORE_SHA" --depth=1
          previous="$RUNNER_TEMP/loki-rows-before"
          git worktree add --detach "$previous" "$BEFORE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$previous/node_modules"
          cp scripts/visual-preview/audit-batches/fix-05.mjs "$previous/scripts/visual-preview/audit-batches/fix-05.mjs"
          cd "$previous"
          pnpm exec electron-vite build
          DATAKOALA_PREVIEW_OUTPUT="$GITHUB_WORKSPACE/loki-row-layout-regression/before" xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs
      - name: Verify native stabilization contract
        env:
          DATAKOALA_PREVIEW_KIND: audit
          DATAKOALA_AUDIT_BATCH: fix-05
          DATAKOALA_AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
          DATAKOALA_PREVIEW_OUTPUT: loki-row-layout-regression/after
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' pnpm exec electron --no-sandbox scripts/capture-visual-preview.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loki-row-layout-regression
          path: loki-row-layout-regression
