name: Format #298 branch

on:
  push:
    branches:
      - feat/298-loki-pattern-inspector

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: feat/298-loki-pattern-inspector

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        run: pnpm format:fix

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/components/results/logs/LogPatternExplorer.tsx \
            src/renderer/src/components/results/logs/LogResultExplorer.tsx \
            src/renderer/src/components/results/logs/LogResultExplorer.ui.test.tsx \
            src/renderer/src/components/ui/ResizableDetailPanel.tsx \
            src/renderer/src/components/workspaces/loki/LokiExplorer.tsx \
            src/shared/log-pattern-filter.test.ts \
            src/shared/log-pattern-filter.ts
          git commit -m "Format #298 implementation"
          git push origin HEAD:feat/298-loki-pattern-inspector
