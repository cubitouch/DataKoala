name: Temporary lint lockfile refresh

on:
  push:
    branches:
      - chore/172-lint-tooling

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/172-lint-tooling

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/update-lint-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/update-lint-lock.yml
          git commit -m "chore: refresh lockfile for lint tooling"
          git push
