name: Format helper

on:
  push:
    branches:
      - docs/polish-homepage

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted stylesheet
        run: |
          pnpm exec prettier docs-site/src/styles.css --write
          echo '---FORMAT-START---'
          base64 -w 0 docs-site/src/styles.css
          echo
          echo '---FORMAT-END---'
