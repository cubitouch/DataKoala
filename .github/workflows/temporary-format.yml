name: Temporary format helper

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and emit changed files
        shell: bash
        run: |
          pnpm format:fix
          while IFS= read -r file; do
            test -f "$file" || continue
            printf 'FORMAT_FILE:%s:%s\n' "$file" "$(base64 -w0 "$file")"
          done < <(git diff --name-only)
