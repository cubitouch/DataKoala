name: Manual macOS packaging (optional)

# Optional test packaging only. Creating a source release never builds installers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Package unsigned macOS application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          pnpm exec electron-builder \
            --mac dmg zip \
            --${{ matrix.arch }} \
            --publish never \
            -c.mac.identity=null \
            -c.mac.hardenedRuntime=false \
            -c.artifactName='DataKoala-${version}-${arch}.${ext}'

      - name: Smoke packaged application
        shell: bash
        run: |
          app_bin="$(find dist -type f -path '*/DataKoala.app/Contents/MacOS/DataKoala' -print -quit)"
          test -n "$app_bin"
          DATAKOALA_ELECTRON_BIN="$app_bin" pnpm smoke:duckdb
          DATAKOALA_ELECTRON_BIN="$app_bin" pnpm smoke:sqlite:electron

      - name: Verify release artifacts
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test -f "dist/DataKoala-${package_version}-${{ matrix.arch }}.dmg"
          test -f "dist/DataKoala-${package_version}-${{ matrix.arch }}.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: datakoala-macos-${{ matrix.arch }}
          path: |
            dist/DataKoala-*.dmg
            dist/DataKoala-*.zip
          if-no-files-found: error
          retention-days: 14
