name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Package unsigned macOS application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          pnpm exec electron-builder \
            --mac dmg zip \
            --${{ matrix.arch }} \
            --publish never \
            -c.mac.identity=null \
            -c.mac.hardenedRuntime=false \
            -c.artifactName='DataKoala-${version}-${arch}.${ext}'

      - name: Smoke packaged application
        shell: bash
        run: |
          app_bin="$(find dist -type f -path '*/DataKoala.app/Contents/MacOS/DataKoala' -print -quit)"
          test -n "$app_bin"
          DATAKOALA_ELECTRON_BIN="$app_bin" pnpm smoke:duckdb
          DATAKOALA_ELECTRON_BIN="$app_bin" pnpm smoke:sqlite:electron

      - name: Verify release artifacts
        shell: bash
        run: |
          test -f "dist/DataKoala-${GITHUB_REF_NAME#v}-${{ matrix.arch }}.dmg"
          test -f "dist/DataKoala-${GITHUB_REF_NAME#v}-${{ matrix.arch }}.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: datakoala-macos-${{ matrix.arch }}
          path: |
            dist/DataKoala-*.dmg
            dist/DataKoala-*.zip
          if-no-files-found: error
          retention-days: 7

  publish-draft-release:
    name: Publish draft GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: datakoala-macos-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release set
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            test -f "release-assets/DataKoala-${version}-${arch}.dmg"
            test -f "release-assets/DataKoala-${version}-${arch}.zip"
          done

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum DataKoala-*.dmg DataKoala-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "DataKoala $tag"
          fi
